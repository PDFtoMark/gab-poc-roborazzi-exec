name: CompareScreenshot
on:
  pull_request:
permissions:
  contents: read
  actions: write
jobs:
  compare-with-base-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Build attacker artifacts
        run: |
          mkdir -p roborazzi pr
          printf 'ATTACKER-CONTROLLED-FILE-CONTENT-1337\n' > roborazzi/pwn_compare.png
          echo "${{ github.event.number }}" > pr/NR
      - uses: actions/upload-artifact@v4
        with:
          name: diff-vs-base-branch
          path: roborazzi
      - uses: actions/upload-artifact@v4
        with:
          name: pr
          path: pr
